<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DOM(문서 객체 모델) 예제</title>
</head>
<body>
    <h2>실습 예제</h2>
    <p id="demo"></p>
    <script>
        const demo = document.getElementById("demo");
        demo.innerText = "여기에";
        demo.style.color = "blue";
        demo.style.backgroundColor = "yellow";
    </script>
</body>
</html>
